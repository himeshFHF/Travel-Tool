name: Validate Wayfarer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Initialize disposable preview database
        run: |
          for migration in drizzle/*.sql; do
            npx wrangler d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file "$migration"
          done
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.ci.config.ts
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: test-results/
